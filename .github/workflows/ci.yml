name: WayToGo
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waytogo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U waytogo" --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://waytogo:test-only@localhost:5432/test
      TEST_DATABASE_URL: postgresql+psycopg://waytogo:test-only@localhost:5432/test
      PUBLIC_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: pnpm/action-setup@v4
        with: {version: 11.25.0}
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm test
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start the self-hosted application
        run: |
          python deploy/init_env.py
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 150
      - name: Prepare isolated travel group
        run: |
          invite=$(docker compose exec -T api python -c 'from seed_demo import seed_demo; print(seed_demo()["url"].split("invite=")[1])')
          echo "::add-mask::$invite"
          echo "E2E_INVITE=$invite" >> "$GITHUB_ENV"
      - run: pnpm e2e
        working-directory: frontend
      - name: Restore a backup into an empty verification database
        run: |
          docker compose exec -T db createdb -U waytogo restore_check
          docker compose exec -T db pg_dump -Fc -U waytogo waytogo | docker compose exec -T db pg_restore --exit-on-error -U waytogo -d restore_check
          docker compose exec -T db psql -U waytogo -d restore_check -c 'select count(*) from trips'
      - if: always()
        run: docker compose down --volumes

